# Keeps the projections and your Yahoo leagues up to date on their own.
# Every 30 minutes: ask each free data source whether it changed (a few seconds). Only when something new posted
# (stats, injury reports, depth charts, rosters, lines...) does it rerun the model. Yahoo rosters, standings and
# settings are re-read each time (once connected); the website is republished only when something changed.
# "Run workflow" on the Actions tab forces a model update.
name: Update projections

on:
  schedule:
    - cron: "7,37 * * * *"
  push:
    paths: ["automation/force_update.txt"]   # Claude can force an update by changing this file
  workflow_dispatch:
    inputs:
      force:
        description: "Rerun the model even if no data changed"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      changed: ${{ steps.done.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for new data
        id: watch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SEASON=$(python -c "import datetime as d; t=d.date.today(); print(t.year if t.month>=3 else t.year-1)")
          echo "season=$SEASON" >> "$GITHUB_OUTPUT"
          pip install -q pandas pyarrow
          python automation/watch.py --season "$SEASON" ${{ ((github.event_name == 'workflow_dispatch' && inputs.force) || github.event_name == 'push') && '--force' || '' }}

      - name: Install model packages
        if: steps.watch.outputs.changed == 'true'
        run: pip install -q pandas pyarrow lightgbm catboost scipy cryptography

      - name: Restore trained models (cache)
        if: steps.watch.outputs.changed == 'true'
        uses: actions/cache/restore@v4
        with:
          path: model/cache
          key: models-${{ github.run_id }}
          restore-keys: models-

      - name: Run the model
        if: steps.watch.outputs.changed == 'true'
        env:
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
        run: |
          python automation/pipeline.py --season ${{ steps.watch.outputs.season }} --reason "${{ steps.watch.outputs.what }}"
          mv automation/state/sources.new.json automation/state/sources.json

      - name: Save trained models (cache)
        if: steps.watch.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: model/cache
          key: models-${{ github.run_id }}

      - name: Yahoo leagues
        id: yahoo
        if: hashFiles('automation/state/yahoo_token.enc') != ''
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
        run: |
          pip install -q pandas cryptography
          python automation/yahoo_sync.py sync

      - name: Commit changes
        id: done
        run: |
          if [ "${{ steps.watch.outputs.changed }}" = "true" ] || [ "${{ steps.yahoo.outputs.changed }}" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          git config user.name "fantasy-oracle-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data automation/state automation/history
          git diff --cached --quiet && exit 0
          git commit -m "Update: ${{ steps.watch.outputs.what }}${{ steps.yahoo.outputs.changed == 'true' && ' yahoo' || '' }}"
          git pull --rebase -X theirs origin ${{ github.ref_name }}
          git push

      - name: Package website
        if: steps.done.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  publish:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publish website
        id: deploy
        uses: actions/deploy-pages@v4
