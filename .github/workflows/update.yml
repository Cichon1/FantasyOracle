# Keeps the projections up to date on its own.
# Every 30 minutes: ask each free data source whether it changed (a few seconds). Only when something new posted
# (stats, injury reports, depth charts, rosters, lines...) does it rerun the model and republish the website.
# "Run workflow" on the Actions tab forces an update.
name: Update projections

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rerun the model even if no data changed"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      changed: ${{ steps.watch.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for new data
        id: watch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SEASON=$(python -c "import datetime as d; t=d.date.today(); print(t.year if t.month>=3 else t.year-1)")
          echo "season=$SEASON" >> "$GITHUB_OUTPUT"
          python automation/watch.py --season "$SEASON" ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '--force' || '' }}

      - name: Install model packages
        if: steps.watch.outputs.changed == 'true'
        run: pip install -q pandas pyarrow lightgbm catboost scipy

      - name: Restore trained models (cache)
        if: steps.watch.outputs.changed == 'true'
        uses: actions/cache/restore@v4
        with:
          path: model/cache
          key: models-${{ github.run_id }}
          restore-keys: models-

      - name: Run the model
        if: steps.watch.outputs.changed == 'true'
        run: python automation/pipeline.py --season ${{ steps.watch.outputs.season }} --reason "${{ steps.watch.outputs.what }}"

      - name: Save trained models (cache)
        if: steps.watch.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: model/cache
          key: models-${{ github.run_id }}

      - name: Commit new projections
        if: steps.watch.outputs.changed == 'true'
        run: |
          mv automation/state/sources.new.json automation/state/sources.json
          git config user.name "fantasy-oracle-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data automation/state/sources.json
          git commit -m "Update: ${{ steps.watch.outputs.what }}" || echo "nothing new"
          git pull --rebase origin ${{ github.ref_name }}
          git push

      - name: Package website
        if: steps.watch.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs


  publish:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publish website
        id: deploy
        uses: actions/deploy-pages@v4
