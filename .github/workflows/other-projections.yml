# Pulls past weekly projections from Sleeper and ESPN for the league sims (automation/other_projections.py).
# Runs when automation/other_proj_request.txt changes (Claude can request a pull by editing it) or by hand.
name: Other sites' projections

on:
  push:
    paths: ["automation/other_proj_request.txt"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull
        run: |
          pip install -q pandas
          python automation/other_projections.py $(cat automation/other_proj_request.txt | tr -cd '0-9 \n')
      - name: Save
        run: |
          git config user.name "fantasy-oracle-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/history/other_proj
          git diff --cached --quiet && exit 0
          git commit -m "Other sites' projections"
          git pull --rebase -X theirs origin ${{ github.ref_name }}
          git push
