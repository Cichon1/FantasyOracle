# One-off check of the FantasyPros API key (shape of each response only). Runs when fp_probe.py changes, or by hand.
name: FantasyPros API check

on:
  push:
    paths: ["automation/fp_probe.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the API
        env:
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
        run: python automation/fp_probe.py
      - name: Save report
        run: |
          git config user.name "fantasy-oracle-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/state/fp_probe.json
          git diff --cached --quiet && exit 0
          git commit -m "FantasyPros API check"
          git pull --rebase -X theirs origin ${{ github.ref_name }}
          git push
