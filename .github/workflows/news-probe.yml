# One-off look at free injury-news feeds (news_probe.py). Runs when news_probe.py changes, or by hand.
name: Injury news probe

on:
  push:
    paths: ["automation/news_probe.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read the feeds
        run: python automation/news_probe.py
      - name: Save report
        run: |
          git config user.name "fantasy-oracle-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/ref/news_probe.json
          git diff --cached --quiet && exit 0
          git commit -m "Injury news probe"
          git pull --rebase -X theirs origin ${{ github.ref_name }}
          git push
