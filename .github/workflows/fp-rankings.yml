# FantasyPros expert rankings (fp_rankings.py) at 11 am, 2 pm, 5 pm and 8 pm Central, nothing overnight.
# GitHub schedules run on UTC, so this wakes at the matching UTC hours for both CDT and CST and the script skips any
# run that isn't one of those Central hours. The rankings are saved encrypted (key from the FANTASYPROS_API_KEY
# secret); the next projections update picks them up. "Run workflow" pulls now.
name: Expert rankings

on:
  schedule:
    - cron: "4 16,17,19,20,22,23,1,2 * * *"
  push:
    paths: ["automation/fp_rankings.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull rankings
        env:
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
        run: |
          pip install -q pandas pyarrow cryptography
          python automation/fp_rankings.py ${{ github.event_name != 'schedule' && '--force' || '' }}
      - name: Save
        run: |
          git config user.name "fantasy-oracle-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A automation/state automation/history docs/data
          git diff --cached --quiet && exit 0
          git commit -m "Expert rankings"
          git pull --rebase -X theirs origin ${{ github.ref_name }}
          git push
