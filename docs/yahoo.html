<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yahoo connected</title><link rel="stylesheet" href="theme.css"><link rel="icon" href="favicon.ico" sizes="any">
<style>.box{max-width:40rem;margin:3rem auto;padding:1.5rem;background:var(--color-panel);border:1px solid var(--color-border-line);border-radius:8px}
code{display:block;word-break:break-all;font-size:1.1rem;padding:.75rem;background:var(--color-bg);border-radius:6px;margin:.75rem 0}</style></head>
<body><div class="box"><h2>Yahoo sign-in</h2><div id="out"></div></div>
<script>
const p = new URLSearchParams(location.search), c = p.get('code'), out = document.getElementById('out');
if (c) {
  out.innerHTML = '<p>Your one-time code:</p><code id="c"></code><p>Copy it into <b>Actions → Connect Yahoo → Run workflow</b> on GitHub. It works for a few minutes and only once.</p>';
  document.getElementById('c').textContent = c;
} else {
  out.textContent = p.get('error_description') || p.get('error') || 'No code here. Open the Yahoo sign-in link again.';
}
</script></body></html>
